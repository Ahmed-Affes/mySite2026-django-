{% extends 'magasin/base.html' %}

{% block title %}Mes Notifications — MyMagasin{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-bell me-2"></i>Notifications</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="list-group shadow-sm">
                {% for notif in notifications %}
                <a href="{{ notif.lien|default:'#' }}" class="list-group-item list-group-item-action py-3 {% if not notif.lu %}bg-light border-start border-primary border-4{% endif %}">
                    <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-1 fw-bold">
                            <i class="fas 
                                {% if notif.type == 'nouvelle_commande' %}fa-shopping-cart text-primary
                                {% elif notif.type == 'statut_commande' %}fa-info-circle text-info
                                {% elif notif.type == 'stock_bas' %}fa-exclamation-triangle text-danger
                                {% else %}fa-bell text-muted{% endif %} me-2"></i>
                            {{ notif.titre }}
                        </h6>
                        <small class="text-muted">{{ notif.cree_le|timesince }}</small>
                    </div>
                    <p class="mb-1 small">{{ notif.message }}</p>
                </a>
                {% empty %}
                <div class="text-center py-5 bg-white border rounded">
                    <i class="fas fa-bell-slash fa-4x text-muted opacity-25 mb-3"></i>
                    <h5 class="text-muted">Aucune notification</h5>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
